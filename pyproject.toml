[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarship-agent"
version = "0.1.0"
description = "Grad School Scholarship Finder Multi-Agent System built with Google ADK and Antigravity Harness Engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.0.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
